version: '3'
services:
  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    ports:
      - "1111:1111"
    volumes:
      - blinkodata:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:78567856@db:5432/blinko
    restart: always
  db:
    image: postgres:14
    container_name: blinko-db
    volumes:
      - blinkodb:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=78567856
volumes:
  blinkodb:
  blinkodata:
